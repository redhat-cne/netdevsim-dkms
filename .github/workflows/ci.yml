# Full CI: build DKMS modules, run smoke tests, build ptp-operator images,
# and run ptp-operator e2e tests on every PR and workflow_dispatch.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DKMS_PKG: netdevsim
  DKMS_VER: "6.9.5"
  PTP_REPO: https://github.com/k8snetworkplumbingwg/ptp-operator.git
  PTP_BRANCH: main

jobs:
  # ------------------------------------------------------------------
  # DKMS build + smoke tests (every PR and workflow_dispatch)
  # ------------------------------------------------------------------
  dkms-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v4

      - name: Install DKMS dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2
          sudo apt-get install -y \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2 \
            dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)

      # Optional: missing on some HWE ABIs (e.g. 7.0). When the package
      # exists (22.04 Azure), apt can stall forever on a 71MB fetch from
      # archive.ubuntu.com — cap it so a dead mirror cannot hang the job.
      - name: Install optional extra kernel modules
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get install -y \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=1 \
            linux-modules-extra-$(uname -r)

      - name: Install DKMS source tree
        run: |
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a Makefile dkms.conf install-udev-rule.sh 99-nsim-ptp.rules \
            include ptp dpll netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/

      - name: DKMS add + build + install
        id: build
        run: |
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          if sudo dkms build ${DKMS_PKG}/${DKMS_VER} 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::DKMS build failed — dumping make.log"
            sudo cat /var/lib/dkms/${DKMS_PKG}/${DKMS_VER}/build/make.log || true
            exit 1
          fi
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /usr/src/${DKMS_PKG}-${DKMS_VER}/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Load modules
        id: load
        run: |
          set -e
          sudo modprobe gnss           && echo "gnss loaded"           || echo "gnss skipped"
          sudo modprobe nsim_ptp       && echo "nsim_ptp loaded"
          sudo modprobe nsim_ptp_mock  && echo "nsim_ptp_mock loaded"
          sudo modprobe nsim_dpll      && echo "nsim_dpll loaded"
          sudo modprobe netdevsim pci_bus_nr=0x1f && echo "netdevsim loaded"
          lsmod | grep -E 'nsim_ptp|nsim_dpll|netdevsim|gnss' || true
          sudo chmod 666 /dev/nsim_ptp* 2>/dev/null || true
          echo "load_ok=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test — create netdevsim device
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr 2>/dev/null || echo 31)
          BUS=$(printf "%02x" "$BUS_NR")
          FAKE_ROOT=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep ":${BUS}:00\.0" | head -1)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          PCI_ADDR="${DOMAIN}:${BUS}:02.0"
          echo "Using PCI address: ${PCI_ADDR}"
          echo "1 ${PCI_ADDR} 1" | sudo tee /sys/bus/netdevsim/new_device
          sleep 1
          ls /sys/bus/netdevsim/devices/netdevsim1/

      - name: Smoke test — verify PTP clock
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          ls /sys/class/nsim_ptp/
          ls -la /dev/nsim_ptp* /dev/ptp* 2>/dev/null || echo "No PTP devices found"
          if [ -e /dev/ptp0 ] && [ -e /dev/nsim_ptp0 ]; then
            PTP_RDEV=$(stat -c '%t:%T' /dev/ptp0)
            NSIM_RDEV=$(stat -c '%t:%T' /dev/nsim_ptp0)
            if [ "$PTP_RDEV" = "$NSIM_RDEV" ]; then
              echo "OK: /dev/ptp0 ($PTP_RDEV) matches /dev/nsim_ptp0"
            else
              echo "WARN: /dev/ptp0 ($PTP_RDEV) != /dev/nsim_ptp0 ($NSIM_RDEV)"
            fi
          else
            echo "WARN: /dev/ptp0 or /dev/nsim_ptp0 not found"
          fi

      - name: Smoke test — verify ethtool PHC
        if: steps.load.outputs.load_ok == 'true'
        run: |
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr 2>/dev/null || echo 31)
          BUS=$(printf "%02x" "$BUS_NR")
          FAKE_ROOT=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep ":${BUS}:00\.0" | head -1)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          IFACE=$(ls /sys/bus/pci/devices/${DOMAIN}:${BUS}:02.0/net/ 2>/dev/null | head -1)
          [ -n "$IFACE" ] && ethtool -T "$IFACE" || echo "WARN: No interface found"

      - name: Cleanup
        if: always()
        run: |
          echo "1" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## DKMS Smoke Tests (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outputs.status || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Load: ${{ steps.load.outputs.load_ok || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # ptp-operator: build images once and upload as artifact
  # ------------------------------------------------------------------
  ptp-images:
    needs: dkms-test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v4

      - name: Install latest podman
        run: |
          . /etc/os-release
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/Release.key" \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
            https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/ /" \
            | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/scripts/start-podman-api-service.sh"

      - name: Clone ptp-operator
        run: |
          sudo rm -rf /root/ptp-operator
          sudo git clone --depth 1 --branch "${PTP_BRANCH}" "${PTP_REPO}" /root/ptp-operator

      - name: "Build images and export tarball"
        run: |
          sudo bash -l <<'BUILD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman
          export BUILDAH_LAYERS=true
          export BUILDAH_HISTORY=true
          export PODMAN_BUILD_OPTS="--rm=false --force-rm=false"

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --images "${VM_IP}"

          rm -rf /tmp/go-build* /root/.cache/go-build
          BUILD

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: ptp-images
          path: /tmp/ptp-images.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # ptp-operator: one parallel runner per scenario
  # ------------------------------------------------------------------
  ptp-test:
    needs: ptp-images
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        mode: [oc, bc, dualnicbc, dualnicbcha, dualfollower]
    steps:
      - name: "Runner info (${{ matrix.os }} / ${{ matrix.mode }})"
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v4

      - name: Install latest podman
        run: |
          . /etc/os-release
          if [[ "${VERSION_ID}" == "22.04" ]]; then
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/Release.key" \
              | sudo gpg --dearmor --yes -o /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
              https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/ /" \
              | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y podman
          else
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/scripts/start-podman-api-service.sh"

      - name: Install OpenShift CLI (oc)
        run: |
          if ! command -v oc &>/dev/null; then
            curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
            sudo tar xzf openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl
            rm -f openshift-client-linux.tar.gz
          fi
          oc version --client

      - name: Install DKMS dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get install -y \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=2 \
            dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)

      - name: Install optional extra kernel modules
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get install -y \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Retries=1 \
            linux-modules-extra-$(uname -r)

      - name: Build and install DKMS modules
        run: |
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a Makefile dkms.conf install-udev-rule.sh 99-nsim-ptp.rules \
            include ptp dpll netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          sudo dkms build ${DKMS_PKG}/${DKMS_VER}
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /usr/src/${DKMS_PKG}-${DKMS_VER}/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Clone ptp-operator
        run: |
          sudo rm -rf /root/ptp-operator
          sudo git clone --depth 1 --branch "${PTP_BRANCH}" "${PTP_REPO}" /root/ptp-operator

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: ptp-images
          path: /tmp

      - name: "Load images into local registry"
        run: |
          sudo bash -l <<'LOAD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --load /tmp/ptp-images.tar "${VM_IP}"
          LOAD

      - name: "Free disk space before tests"
        run: |
          sudo bash -l <<'CLEANUP'
          set -euo pipefail
          rm -rf /tmp/ptp-images.tar /tmp/ptp-images-load
          rm -rf /tmp/go-build* /var/cache/apt /root/.cache
          sync
          echo 3 > /proc/sys/vm/drop_caches || true
          df -h
          free -h
          CLEANUP

      - name: "Run scenario: ${{ matrix.mode }}"
        run: |
          sudo bash -l <<'DEPLOY'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --deploy "${VM_IP}" --mode "${{ matrix.mode }}" "${VM_IP}"
          DEPLOY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptp-artifacts-${{ matrix.os }}-${{ matrix.mode }}
          path: /tmp/artifacts/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          for id in $(ls /sys/bus/netdevsim/devices/ 2>/dev/null | sed 's/netdevsim//'); do
            echo "$id" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          done
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## ptp-operator: ${{ matrix.os }} / ${{ matrix.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
